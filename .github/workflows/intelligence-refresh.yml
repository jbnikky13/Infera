name: Infera Intelligence Refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger intelligence pipeline
        env:
          INFERA_URL: ${{ secrets.INFERA_URL }}
        run: |
          test -n "$INFERA_URL" || { echo "INFERA_URL secret is required"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$INFERA_URL/api/intelligence" > /tmp/infera-response.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/infera-response.json')); console.log('Infera refreshed:', x.count, 'stories;', x.highSignalCount, 'high-signal;', x.persistence?.persisted ? x.persistence.count + ' persisted' : 'persistence not configured')"
