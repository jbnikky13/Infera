name: Infera Intelligence Ingestion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never allow two ingestion runs to mutate the same intelligence store at once.
# GitHub documents concurrency groups as the mechanism for preventing parallel runs.
concurrency:
  group: infera-intelligence-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate production endpoint
        env:
          INFERA_URL: ${{ secrets.INFERA_URL }}
        run: |
          set -euo pipefail
          if [ -z "${INFERA_URL:-}" ]; then
            echo "ERROR: GitHub Actions secret INFERA_URL is missing or empty."
            exit 1
          fi

          BASE_URL="${INFERA_URL%/}"
          echo "Checking Infera production endpoint..."

          HEALTH_STATUS=$(curl -sS -L --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 60 \
            -H 'Accept: application/json' \
            -H 'User-Agent: InferaScheduler/1.0' \
            -o /tmp/infera-health.json -w '%{http_code}' \
            "$BASE_URL/api/health") || {
              echo "ERROR: Could not connect to $BASE_URL/api/health"
              exit 1
            }

          echo "Health HTTP status: $HEALTH_STATUS"
          cat /tmp/infera-health.json
          echo

          if [ "$HEALTH_STATUS" -lt 200 ] || [ "$HEALTH_STATUS" -ge 300 ]; then
            echo "ERROR: Infera health endpoint returned HTTP $HEALTH_STATUS."
            exit 1
          fi

          python - <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path('/tmp/infera-health.json').read_text(errors='replace')
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f'ERROR: /api/health returned invalid JSON: {exc}')
              sys.exit(1)
          if not isinstance(data, dict) or data.get('ok') is not True:
              print('ERROR: /api/health returned a non-healthy payload.')
              print(raw[:10000])
              sys.exit(1)
          checks = data.get('checks') or {}
          if checks and not all(value is True for value in checks.values()):
              print('ERROR: One or more production health checks failed.')
              print(raw[:10000])
              sys.exit(1)
          print('Production health checks passed.')
          PY

      - name: Refresh and persist intelligence
        env:
          INFERA_URL: ${{ secrets.INFERA_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${INFERA_URL%/}"
          echo "Calling $BASE_URL/api/news ..."

          HTTP_STATUS=$(curl -sS -L --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 300 \
            -H 'Accept: application/json' \
            -H 'User-Agent: InferaScheduler/1.0' \
            -o /tmp/infera-response.json -w '%{http_code}' \
            "$BASE_URL/api/news") || {
              echo "ERROR: Request to /api/news failed at the network level."
              exit 1
            }

          echo "News endpoint HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: /api/news returned HTTP $HTTP_STATUS"
            cat /tmp/infera-response.json || true
            exit 1
          fi

          if [ ! -s /tmp/infera-response.json ]; then
            echo "ERROR: /api/news returned an empty response."
            exit 1
          fi

          python - <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path('/tmp/infera-response.json').read_text(errors='replace')
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f'ERROR: invalid JSON: {exc}')
              print(raw[:10000])
              sys.exit(1)

          if not isinstance(data, dict):
              print('ERROR: /api/news returned non-object JSON')
              sys.exit(1)

          print(f"Infera ingestion completed: {data.get('count', 0)} stories")
          print(f"AI configured: {data.get('aiConfigured', False)}")

          p = data.get('persistence') or {}
          print(f"Persistence: {p.get('persisted')} ({p.get('count', 0)} stories)")
          if not p.get('persisted'):
              print(f"Persistence reason: {p.get('reason', 'unknown')}")
              sys.exit(1)

          failed = [x for x in data.get('sourceStatus', []) if x.get('error')]
          if failed:
              print(f"WARNING: {len(failed)} source(s) failed")
              for item in failed:
                  print(f"- {item.get('source')}: {item.get('error')}")
          else:
              print('All configured news sources completed without reported errors.')

          if data.get('count', 0) == 0 and not failed:
              print('WARNING: ingestion returned zero stories without source errors.')
          PY
