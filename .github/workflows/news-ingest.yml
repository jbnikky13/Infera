name: Nexora News Ingestion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Nexora ingestion endpoint
        env:
          NEXORA_INGEST_URL: ${{ secrets.NEXORA_INGEST_URL }}
        run: |
          if [ -z "$NEXORA_INGEST_URL" ]; then
            echo "NEXORA_INGEST_URL is not configured; skipping scheduled ingestion."
            exit 0
          fi
          curl --fail --retry 3 --max-time 60 "$NEXORA_INGEST_URL"
